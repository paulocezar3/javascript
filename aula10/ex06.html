<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eventos DOM</title>
    <style>
        #area{
            font: normal 20pt arial;
            background-color: green;
            color: aliceblue;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrou()">
        Interaja...
    </div>
    <script>
        function clicar(){
            var area = document.getElementById('area')
            area.innerText = 'clicou!'
        }
        function entrou(){
            var entrou = document.getElementById('area')
            entrou.style.backgroundColor = 'darkred'
        }
    </script>
</body>
</html>
